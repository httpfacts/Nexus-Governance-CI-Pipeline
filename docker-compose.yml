services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    expose:
      - "4000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/policy:/app/policy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexus-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
